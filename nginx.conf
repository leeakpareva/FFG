server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind the Cloudflare tunnel, so TLS terminates upstream.
  # These are the headers the tunnel does not set for us.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets are immutable; the HTML shell must never be cached
  # or members keep loading an old bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # API and uploaded media are proxied to ffg-api on the same origin, so
  # there is no CORS and the Clerk token rides along on a same-site request.
  location /api/ {
    proxy_pass http://ffg-api:8110;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Uploads: images 8MB, video 60MB, enforced server-side. Headroom for
    # the multipart envelope so nginx returns the API's error, not its own.
    client_max_body_size 128m;
    proxy_read_timeout 120s;
  }

  location /media/ {
    proxy_pass http://ffg-api:8110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 7d;
  }

  # The admin panel is its own bundle behind its own login. The path serves
  # the admin shell; everything real is enforced by the API token.
  location /admin {
    try_files /admin.html =404;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # SPA: /sso-callback and /not-a-member are client-side routes and must
  # return the shell rather than a 404 — same job as vercel.json rewrites.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
